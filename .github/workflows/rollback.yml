name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Git commit SHA of the image tag to redeploy (as pushed by cd.yml)"
        required: true

permissions: {}

env:
  PROJECT_ID: sports-play-analyzer
  REGION: asia-south1
  AR_REPO: asia-south1-docker.pkg.dev/sports-play-analyzer/sports-analyzer
  WEB_SERVICE: sports-analyzer-web
  WORKER_POOL: sports-analyzer-worker
  CLOUDSQL_CONN: sports-play-analyzer:asia-south1:sports-analyzer-db
  RUNTIME_SA: sports-analyzer-run@sports-play-analyzer.iam.gserviceaccount.com
  APP_ORIGIN: https://sports-analyzer-web-328974482077.asia-south1.run.app

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/328974482077/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@sports-play-analyzer.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Rollback never runs migrations: it redeploys a PREVIOUS image, and a forward
      # migration run while rolling back could put the schema ahead of the old code.
      - name: Verify the target image exists
        run: |
          gcloud artifacts docker images describe \
            "${{ env.AR_REPO }}/web:${{ github.event.inputs.image_sha }}" --quiet

      - name: Redeploy web service to the previous image
        run: |
          IMAGE="${{ env.AR_REPO }}/web:${{ github.event.inputs.image_sha }}"
          gcloud run deploy "${{ env.WEB_SERVICE }}" \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --add-cloudsql-instances="${{ env.CLOUDSQL_CONN }}" \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=3 \
            --cpu=1 \
            --memory=1Gi \
            --set-env-vars="APP_ENV=production,APP_ORIGIN=${{ env.APP_ORIGIN }},GIT_SHA=${{ github.event.inputs.image_sha }},BLOB_BACKEND=s3,S3_ENDPOINT_URL=https://storage.googleapis.com,S3_BUCKET=sports-play-analyzer-media,S3_REGION=auto,COOKIE_SECURE=true" \
            --set-secrets="DATABASE_URL=database-url:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,SESSION_SECRET=session-secret:latest,S3_ACCESS_KEY_ID=s3-access-key-id:latest,S3_SECRET_ACCESS_KEY=s3-secret-access-key:latest" \
            --quiet

      - name: Redeploy worker pool to the previous image
        run: |
          IMAGE="${{ env.AR_REPO }}/web:${{ github.event.inputs.image_sha }}"
          gcloud run worker-pools deploy "${{ env.WORKER_POOL }}" \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --add-cloudsql-instances="${{ env.CLOUDSQL_CONN }}" \
            --instances=1 \
            --cpu=2 \
            --memory=2Gi \
            --command="python" \
            --args="-m,app.entrypoints.worker" \
            --set-env-vars="APP_ENV=production,GIT_SHA=${{ github.event.inputs.image_sha }},BLOB_BACKEND=s3,S3_ENDPOINT_URL=https://storage.googleapis.com,S3_BUCKET=sports-play-analyzer-media,S3_REGION=auto" \
            --set-secrets="DATABASE_URL=database-url:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,SESSION_SECRET=session-secret:latest,S3_ACCESS_KEY_ID=s3-access-key-id:latest,S3_SECRET_ACCESS_KEY=s3-secret-access-key:latest" \
            --quiet

      - name: Verify rollback
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS "${{ env.APP_ORIGIN }}/health" || true)
            if echo "$BODY" | grep -q '"status":"ok"' && echo "$BODY" | grep -q "${{ github.event.inputs.image_sha }}"; then
              echo "rolled back to sha ${{ github.event.inputs.image_sha }}"
              exit 0
            fi
            sleep 3
          done
          echo "rollback health check failed or sha mismatch"
          exit 1
