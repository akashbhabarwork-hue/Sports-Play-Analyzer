name: CI

on:
  push:
  pull_request:

# Least privilege: nothing by default, each job opts in to what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Design checker
        working-directory: .
        run: >-
          python -c "import sys; sys.path.insert(0, '.agent/skills/python-backend-design/scripts');
          import check_design; sys.exit(check_design.main('backend/app'))"
      - name: Unit tests
        run: pytest -q -m "not integration and not model"
      - name: Integration tests
        # pytest exits 5 when nothing is collected; allowed until T-020 adds integration tests.
        run: |
          set +e
          pytest -q -m integration
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice::No integration tests collected yet"
            exit 0
          fi
          exit "$rc"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20" # matches the Dockerfile build stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          docker run -d --name web --network host \
            -e DATABASE_URL=postgresql+psycopg://app:app@localhost:5432/app \
            -e GIT_SHA="$GIT_SHA" \
            analyzer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              curl -fsS http://localhost:8000/ | grep -q 'id="root"'
              exit 0
            fi
            sleep 2
          done
          docker logs web
          exit 1
