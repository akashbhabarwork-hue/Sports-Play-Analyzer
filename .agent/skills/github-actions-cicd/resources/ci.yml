name: CI
on:
  push:
  pull_request:
permissions: {}

jobs:
  backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@<SHA> # v4.x.x
      - uses: actions/setup-python@<SHA> # v5.x.x
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check backend && ruff format --check backend
      - run: python -c "import sys; sys.path.insert(0,'.agent/skills/python-backend-design/scripts'); import check_design; sys.exit(check_design.main('backend/app'))"
      - run: pytest -q backend/tests -m "not integration and not model"
      - run: pytest -q backend/tests -m "integration"

  frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@<SHA> # v4.x.x
      - uses: actions/setup-node@<SHA> # v4.x.x
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@<SHA> # v4.x.x
      - uses: docker/setup-buildx-action@<SHA> # v3.x.x
      - uses: docker/build-push-action@<SHA> # v6.x.x
        with: { context: ., push: false, tags: "analyzer:ci" }
