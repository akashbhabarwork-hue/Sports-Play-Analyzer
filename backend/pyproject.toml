[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --cov=app --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (TEST_DATABASE_URL)",
    "model: needs the ONNX model weights",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
